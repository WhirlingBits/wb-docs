          description: Saved

  /api/admin/bootstrap/devices:
    get:
      tags: [Admin – Config]
      summary: List registered bootstrap devices
      responses:
        "200":
          description: Bootstrap devices
    post:
      tags: [Admin – Config]
      summary: Register a bootstrap device (PSK credentials)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, pskIdentity, pskKey]
              properties:
                endpoint:
                  type: string
                pskIdentity:
                  type: string
                pskKey:
                  type: string
                  description: Hex-encoded PSK key (min 16 hex chars / 8 bytes)
      responses:
        "200":
          description: Device registered

  /api/admin/bootstrap/devices/{endpoint}:
    delete:
      tags: [Admin – Config]
      summary: Remove a bootstrap device
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed

  # ════════════════════════════════════════════════════════════════════
  # Admin – OTA
  # ════════════════════════════════════════════════════════════════════

  /api/admin/ota/files:
    get:
      tags: [Admin – OTA]
      summary: List all OTA files (sysadmin sees all tenants)
      responses:
        "200":
          description: OTA files
    post:
      tags: [Admin – OTA]
      summary: Upload a new OTA firmware file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, version, deviceType]
              properties:
                file:
                  type: string
                  format: binary
                filename:
                  type: string
                version:
                  type: string
                deviceType:
                  type: string
                target:
                  type: string
                  default: default
                variant:
                  type: string
                  default: stable
      responses:
        "200":
          description: File uploaded

  /api/admin/ota/files/{id}:
    delete:
      tags: [Admin – OTA]
      summary: Delete an OTA file (sysadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /api/admin/device-profiles:
    get:
      tags: [Admin – OTA]
      summary: List device profiles (sysadmin)
      responses:
        "200":
          description: Profiles
    post:
      tags: [Admin – OTA]
      summary: Create a device profile (sysadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProfile"
      responses:
        "200":
          description: Profile created

  /api/admin/device-profiles/{id}:
    get:
      tags: [Admin – OTA]
      summary: Get a device profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
    patch:
      tags: [Admin – OTA]
      summary: Update a device profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProfile"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Admin – OTA]
      summary: Delete a device profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /api/admin/device-profiles/{id}/deploy:
    post:
      tags: [Admin – OTA]
      summary: Deploy profile to assigned devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deploy triggered

  /api/admin/device-profiles/{id}/endpoints:
    post:
      tags: [Admin – OTA]
      summary: Assign an endpoint to a device profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
      responses:
        "200":
          description: Endpoint assigned

  /api/admin/device-profiles/{id}/endpoints/{endpoint}:
    delete:
      tags: [Admin – OTA]
      summary: Remove an endpoint from a device profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed

  /api/admin/telemetry/stats:
    get:
      tags: [Admin – OTA]
      summary: Get telemetry storage statistics
      responses:
        "200":
          description: Stats

  /api/admin/telemetry/cleanup:
    post:
      tags: [Admin – OTA]
      summary: Trigger telemetry data cleanup (old data pruning)
      responses:
        "200":
          description: Cleanup triggered

  # ════════════════════════════════════════════════════════════════════
  # Admin – Backups
  # ════════════════════════════════════════════════════════════════════

  /api/admin/backups:
    get:
      tags: [Admin – Backups]
      summary: List backups
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Backup"
    post:
      tags: [Admin – Backups]
      summary: Create a manual backup
      responses:
        "200":
          description: Backup created

  /api/admin/backups/upload:
    post:
      tags: [Admin – Backups]
      summary: Upload a backup file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Backup uploaded

  /api/admin/backups/{id}/restore:
    post:
      tags: [Admin – Backups]
      summary: Restore from a backup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restore initiated

  /api/admin/backups/{id}/download:
    get:
      tags: [Admin – Backups]
      summary: Download a backup file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Backup file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/admin/backups/{id}/validate:
    get:
      tags: [Admin – Backups]
      summary: Validate a backup (integrity check)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validation result

  /api/admin/backups/{id}:
    delete:
      tags: [Admin – Backups]
      summary: Delete a backup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /api/admin/backup/schedule:
    get:
      tags: [Admin – Backups]
      summary: Get backup schedule configuration
      responses:
        "200":
          description: Schedule config
    post:
      tags: [Admin – Backups]
      summary: Save backup schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                scheduleType:
                  type: string
                  enum: [daily, weekly]
                scheduleHour:
                  type: integer
                  minimum: 0
                  maximum: 23
                scheduleMinute:
                  type: integer
                  minimum: 0
                  maximum: 59
                scheduleDayOfWeek:
                  type: string
                  enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      responses:
        "200":
          description: Schedule saved

  # ════════════════════════════════════════════════════════════════════
  # Admin – System
  # ════════════════════════════════════════════════════════════════════

  /api/admin/system/metrics:
    get:
      tags: [Admin – System]
      summary: Get system metrics (CPU, memory, JVM, DB pool)
      responses:
        "200":
          description: System metrics

  /api/admin/security/selfcheck:
    get:
      tags: [Admin – System]
      summary: Run security self-check (OWASP-inspired checks)
      responses:
        "200":
          description: Self-check result

  /api/admin/audit:
    get:
      tags: [Admin – System]
      summary: Query audit log
      parameters:
        - name: username
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"

  /api/admin/logs:
    get:
      tags: [Admin – System]
      summary: Get server log entries
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [DEBUG, INFO, WARN, ERROR]
        - name: component
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          description: Log entries

  /api/admin/events:
    get:
      tags: [Admin – System]
      summary: Server-Sent Events stream (real-time device events)
      description: |
        SSE stream delivering real-time events. Token must be passed as a query parameter
        because the `EventSource` API does not support custom headers.

        **Event types:** `device-registered`, `device-unregistered`, `bootstrap-provisioned`,
        `command-applied`, `config-updated`
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Bearer token (required because EventSource cannot set headers)
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
