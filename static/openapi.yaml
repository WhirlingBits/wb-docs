openapi: 3.1.0
info:
  title: WhirlingBits IoT Server API
  version: "1.0"
  description: |
    REST API for the WhirlingBits IoT Server — LwM2M device management,
    telemetry, OTA updates, user/tenant management and system administration.

    ## Authentication
    All protected endpoints require a **Bearer token** obtained via `POST /api/auth/login`.

    ```
    Authorization: Bearer <token>
    ```

    API keys are also accepted as Bearer tokens for programmatic access.

  contact:
    name: WhirlingBits
  license:
    name: Proprietary

servers:
  - url: http://localhost:18080
    description: Local development

tags:
  - name: Auth
    description: Authentication, registration, 2FA, sessions, API keys
  - name: Devices
    description: LwM2M device management, resources, attributes, telemetry
  - name: OTA
    description: Over-the-Air firmware management and deployment
  - name: Bootstrap
    description: LwM2M Bootstrap assignments and device profiles
  - name: Alerts
    description: Device offline alert rules and alert history
  - name: Profiles
    description: Device profiles
  - name: Groups
    description: Device groups
  - name: Tenant
    description: Tenant user management (role: tenant)
  - name: Admin – Users
    description: Sysadmin user and tenant management
  - name: Admin – Config
    description: LwM2M, SMTP and Bootstrap server configuration
  - name: Admin – OTA
    description: Sysadmin OTA file management
  - name: Admin – Backups
    description: Database backup and restore
  - name: Admin – System
    description: Audit log, system metrics, server logs, SSE events
  - name: Public
    description: Unauthenticated endpoints

# ─────────────────────────────────────────────────────────────────────────────
# Reusable components
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Primitives / shared ────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized"

    UserAccount:
      type: object
      properties:
        username:
          type: string
          example: alice
        displayName:
          type: string
          example: Alice Wonderland
        email:
          type: string
          format: email
          nullable: true
        role:
          type: string
          enum: [sysadmin, tenant, user]
        tenantId:
          type: string
          nullable: true
        language:
          type: string
          enum: [de, en]
          default: de
        emailVerified:
          type: boolean
        twoFactorEnabled:
          type: boolean

    Device:
      type: object
      properties:
        endpoint:
          type: string
          example: device-001
        alive:
          type: boolean
        lwm2mVersion:
          type: string
          example: "1.1"
        objects:
          type: array
          items:
            type: string
        lastSeen:
          type: string
          format: date-time
          nullable: true
        username:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        deviceType:
          type: string
          nullable: true

    OtaFile:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        version:
          type: string
        deviceType:
          type: string
        target:
          type: string
          default: default
        variant:
          type: string
          default: stable
        size:
          type: integer
        sha256:
          type: string
        uploadedAt:
          type: string

    AlertRule:
      type: object
      properties:
        id:
          type: string
        endpointPattern:
          type: string
          example: "device-*"
        thresholdMinutes:
          type: integer
          example: 30
        channelType:
          type: string
          enum: [email, webhook, both]
        email:
          type: string
          nullable: true
        webhookUrl:
          type: string
          nullable: true
        enabled:
          type: boolean

    BootstrapAssignment:
      type: object
      properties:
        endpointPattern:
          type: string
        username:
          type: string
          nullable: true
        tenantId:
          type: string
        matchType:
          type: string
          enum: [exact, wildcard]
        provisionedFrom:
          type: string
          nullable: true

    DeviceProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        deviceType:
          type: string
        firmwareVersions:
          type: array
          items:
            type: string
        supportedResources:
          type: array
          items:
            type: object

    Backup:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
        type:
          type: string
          enum: [manual, scheduled, pre-restore]

    AuditEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        username:
          type: string
        tenantId:
          type: string
          nullable: true
        action:
          type: string
        resource:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true

    Session:
      type: object
      properties:
        sessionId:
          type: string
        userAgent:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    Invitation:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
        tenantId:
          type: string
          nullable: true
        used:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        invitationLink:
          type: string

security:
  - bearerAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════════════════════
  # Public
  # ════════════════════════════════════════════════════════════════════

  /health:
    get:
      tags: [Public]
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/version:
    get:
      tags: [Public]
      summary: Server version
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "1.2.0"

  # ════════════════════════════════════════════════════════════════════
  # Auth
  # ════════════════════════════════════════════════════════════════════

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticates a user and returns a JWT token. If 2FA is enabled the response contains `twoFactorRequired: true` and a `challengeToken` instead of the actual token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: "#/components/schemas/UserAccount"
                  - type: object
                    description: 2FA challenge
                    properties:
                      twoFactorRequired:
                        type: boolean
                        example: true
                      challengeToken:
                        type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify 2FA code during login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken:
                  type: string
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: 2FA verified, returns JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserAccount"
        "401":
          description: Invalid code

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate current session token)
      responses:
        "200":
          description: Logged out

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user (legacy, prefer /api/auth/account)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserAccount"

  /api/auth/account:
    get:
      tags: [Auth]
      summary: Get current user account details
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserAccount"
    patch:
      tags: [Auth]
      summary: Update account (displayName, email, language)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                email:
                  type: string
                  format: email
                language:
                  type: string
                  enum: [de, en]
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserAccount"

  /api/auth/account/password:
    post:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        "200":
          description: Password changed

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register with invitation token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitationToken, username, displayName, password]
              properties:
                invitationToken:
                  type: string
                username:
                  type: string
                displayName:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Registered successfully
        "400":
          description: Invalid token or validation error

  /api/auth/email/verify:
    get:
      tags: [Auth]
      summary: Verify email address via token link
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
        "400":
          description: Invalid or expired token

  /api/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: Username or email address
      responses:
        "200":
          description: Reset email sent (always returns 200 to prevent enumeration)

  /api/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password using reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        "200":
          description: Password reset successful
        "400":
          description: Invalid or expired token

  /api/auth/invitations/inspect:
    get:
      tags: [Auth]
      summary: Inspect an invitation token (public, pre-registration)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                  email:
                    type: string
                    nullable: true
                  role:
                    type: string
                  tenantId:
                    type: string
                    nullable: true

  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions for current user
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"

  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke a specific session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked

  /api/auth/2fa/status:
    get:
      tags: [Auth]
      summary: Get 2FA status for current user
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean

  /api/auth/2fa/setup:
    get:
      tags: [Auth]
      summary: Generate TOTP setup (QR code URL + secret)
      responses:
        "200":
          description: TOTP setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qrUrl:
                    type: string

  /api/auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable 2FA (confirm with TOTP code + password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code:
                  type: string
                  example: "123456"
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: 2FA enabled

  /api/auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA (confirm with password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: 2FA disabled

  /api/users/{username}/language:
    patch:
      tags: [Auth]
      summary: Update language preference for a user
      description: A user can update their own language. Sysadmin can update any user.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  type: string
                  enum: [de, en]
      responses:
        "200":
          description: Language updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserAccount"

  # ════════════════════════════════════════════════════════════════════
  # Devices
  # ════════════════════════════════════════════════════════════════════

  /api/devices:
    get:
      tags: [Devices]
      summary: List all devices visible to current user
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"

  /api/devices/{endpoint}/resources:
    get:
      tags: [Devices]
      summary: Get cached LwM2M resources for a device
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource list
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          example: "/3/0/0"
                        value:
                          type: string
                          nullable: true
                        status:
                          type: string
                        readAt:
                          type: string
                          format: date-time
                          nullable: true

  /api/devices/{endpoint}/resources/refresh:
    post:
      tags: [Devices]
      summary: Trigger a resource refresh (reads all objects from device)
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refresh triggered

  /api/devices/{endpoint}/resources/read:
    post:
      tags: [Devices]
      summary: Read a single LwM2M resource path
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  example: "/3/0/0"
      responses:
        "200":
          description: Resource value
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  value:
                    type: string
                    nullable: true
                  status:
                    type: string

  /api/devices/{endpoint}/resources/{lwm2mPath}:
    put:
      tags: [Devices]
      summary: Write a LwM2M resource (or enqueue if device is offline)
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
        - name: lwm2mPath
          in: path
          required: true
          schema:
            type: string
            example: "3/0/13"
        - name: enqueue
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          description: Write result

  /api/devices/{endpoint}/execute/{lwm2mPath}:
    post:
      tags: [Devices]
      summary: Execute a LwM2M resource (or enqueue if offline)
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
        - name: lwm2mPath
          in: path
          required: true
          schema:
            type: string
            example: "3/0/4"
        - name: enqueue
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Execute result

  /api/devices/{endpoint}/commands:
    get:
      tags: [Devices]
      summary: Get pending / recent commands for a device
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command list

  /api/devices/{endpoint}/pending-commands/{commandId}:
    delete:
      tags: [Devices]
      summary: Cancel a pending command
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
        - name: commandId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command cancelled

  /api/devices/{endpoint}/attributes:
    get:
      tags: [Devices]
      summary: Get all attributes (server + client + shared)
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All attribute categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    type: array
                    items:
                      type: object
                  client:
                    type: array
                    items:
                      type: object
                  shared:
                    type: array
                    items:
                      type: object

  /api/devices/{endpoint}/attributes/server:
    get:
      tags: [Devices]
      summary: Get server-side attributes
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server attributes
    post:
      tags: [Devices]
      summary: Create or update a server attribute
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
      responses:
        "200":
          description: Attribute saved

  /api/devices/{endpoint}/attributes/server/{key}:
    delete:
      tags: [Devices]
      summary: Delete a server attribute
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /api/devices/{endpoint}/attributes/client:
    get:
      tags: [Devices]
      summary: Get client-reported attributes
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client attributes

  /api/devices/{endpoint}/attributes/shared:
    get:
      tags: [Devices]
      summary: Get shared attributes (synced to device via LwM2M)
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared attributes
    post:
      tags: [Devices]
      summary: Create or update a shared attribute (syncs to device)
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                lwm2mPath:
                  type: string
                  description: Optional LwM2M path to write on sync
                  example: "/19/0/0"
                value:
                  type: string
      responses:
        "200":
          description: Attribute saved and sync triggered

  /api/devices/{endpoint}/attributes/shared/{key}:
    delete:
      tags: [Devices]
      summary: Delete a shared attribute
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /api/devices/{endpoint}/attributes/batch:
    post:
      tags: [Devices]
      summary: Set multiple attributes in one request
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server:
                  type: object
                  additionalProperties:
                    type: string
                shared:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Attributes updated

  /api/devices/{endpoint}/telemetry:
    get:
      tags: [Devices]
      summary: Get latest telemetry values for a device
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Telemetry key-value pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  telemetry:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                        timestamp:
                          type: string
                          format: date-time

  /api/devices/{endpoint}/telemetry/keys:
    get:
      tags: [Devices]
      summary: List all telemetry keys for a device
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Telemetry keys

  /api/devices/{endpoint}/telemetry/series:
